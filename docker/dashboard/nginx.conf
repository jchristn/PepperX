server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: any path that is not a real file is the app's to resolve, so it must be
    # served index.html rather than a 404. Without this, reloading /containers returns nothing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that must never be cached: it is what points at the current asset
    # hashes, and a stale copy would load assets that no longer exist.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
