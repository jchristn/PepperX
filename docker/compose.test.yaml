name: pepperx-test

services:
  postgres:
    image: postgres:17
    container_name: pepperx-test-postgres
    environment:
      POSTGRES_USER: pepperx_test
      POSTGRES_PASSWORD: pepperx_test
      POSTGRES_DB: pepperx_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepperx_test -d pepperx_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
