# Prometheus configuration for the PepperX observability stack.
#
# PepperX itself does not expose a scrape endpoint in this stack; the nodes push OTLP to the collector,
# and Prometheus scrapes the collector's Prometheus exporter (otel-collector:8889). Prometheus also
# scrapes itself for stack health.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
