# A complete PepperX deployment: PostgreSQL, two stateless nodes, and the dashboard.
#
#   cd docker && docker compose up -d
#   open http://localhost:3000  and connect to  http://localhost:8000
#
# The images are pulled from Docker Hub rather than built here, so this file works from a bare
# checkout of just docker/. To build and publish them yourself, run build-all.bat from the repository
# root -- it produces multi-architecture images for linux/amd64 and linux/arm64/v8.
#
# Two nodes rather than one on purpose. PepperX nodes are stateless and coordinate through the
# database and shared storage, and a single-node stack would hide the mistakes that only appear with
# more than one -- notably that both nodes must see the same extent storage. Point them at different
# volumes and reads will intermittently 404 depending on which node answers.
#
# There is no authentication anywhere in this stack. That is by design: PepperX is backend
# infrastructure meant to sit behind a service that does its own access control. Do not publish
# these ports to a public network.

name: pepperx

services:
  postgres:
    image: postgres:17
    container_name: pepperx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pepperx
      POSTGRES_PASSWORD: pepperx
      POSTGRES_DB: pepperx
    ports:
      # Published on 5442, not 5432. The nodes reach Postgres over the compose network and do not
      # need this at all; it is here so you can inspect the metadata with psql. Using the default
      # port would collide with the PostgreSQL most developers already run locally, and the stack
      # would refuse to start for a mapping nothing depends on.
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepperx -d pepperx"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pepperx

  node1:
    image: jchristn77/pepperx-server:v0.1.0
    container_name: pepperx-node1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Telemetry is off in the committed node config; the stack turns it on here and points every node
      # at the collector. Metrics, traces, and logs are pushed over OTLP/gRPC to otel-collector:4317,
      # which fans them out to Prometheus, Tempo, and Loki. See TELEMETRY.md.
      PEPPERX_TELEMETRY_ENABLED: "true"
      PEPPERX_TELEMETRY_OTLP_ENDPOINT: "http://otel-collector:4317"
      PEPPERX_TELEMETRY_OTLP_PROTOCOL: "grpc"
    ports:
      - "8000:8000"   # REST
      - "8001:8001"   # S3
      - "8002:8002"   # WebSockets
      - "8003:8003"   # MCP over HTTP
      - "8004:8004"   # MCP over TCP
      - "6379:6379"   # Redis RESP
    volumes:
      # Read-write, not :ro, so the Settings page can persist edits: the update endpoint writes to
      # /app/pepperx.json, and the node re-reads it on the restart that applies the change. This does
      # mean the committed config/node1.json is modified in place when you save settings.
      - ./config/node1.json:/app/pepperx.json
      # Both nodes mount the same extent volume. This is the requirement that makes them
      # interchangeable: any node must be able to serve any object.
      - extent-data:/app/data/extents
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/v1.0/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - pepperx

  node2:
    image: jchristn77/pepperx-server:v0.1.0
    container_name: pepperx-node2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      node1:
        # Not a runtime dependency -- only so one node creates the schema before the other starts,
        # which keeps the first run's logs free of harmless migration races.
        condition: service_started
    environment:
      PEPPERX_TELEMETRY_ENABLED: "true"
      PEPPERX_TELEMETRY_OTLP_ENDPOINT: "http://otel-collector:4317"
      PEPPERX_TELEMETRY_OTLP_PROTOCOL: "grpc"
    ports:
      - "8010:8000"
      - "8011:8001"
      - "8012:8002"
      - "8013:8003"
      - "8014:8004"
      - "6380:6379"
    volumes:
      - ./config/node2.json:/app/pepperx.json
      - extent-data:/app/data/extents
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/v1.0/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - pepperx

  dashboard:
    image: jchristn77/pepperx-dashboard:v0.1.0
    container_name: pepperx-dashboard
    restart: unless-stopped
    environment:
      # Pre-filled on the connect screen. This is node1's REST port -- 8000, not the 6379 that also
      # appears in `docker ps` for the same container, which is the Redis RESP listener and speaks a
      # different protocol entirely.
      #
      # The browser resolves this, not the container, so it has to be an address reachable from
      # wherever the operator is: a compose service name like http://node1:8000 would resolve inside
      # the network and nowhere else.
      #
      # 127.0.0.1 rather than localhost: on Windows the browser prefers IPv6 (::1) for localhost, and
      # WSL2's port relay can wedge the ::1 forward after a container recreate, leaving every call
      # pending. Pinning IPv4 sidesteps that; operators on other hosts can still override this.
      PEPPERX_SERVER_URL: http://127.0.0.1:8000
    ports:
      - "3000:80"
    networks:
      - pepperx

  # ---------------------------------------------------------------------------------------------------
  # Observability stack (LGTM): the nodes push OTLP to the collector, which fans metrics out to
  # Prometheus, traces to Tempo, and logs to Loki. Grafana reads all three. See TELEMETRY.md.
  #
  # Port map (host side), chosen to avoid every port the data plane already uses (5442, 8000-8004,
  # 8010-8014, 6379, 6380, 3000):
  #   4317  otel-collector OTLP/gRPC        4318  otel-collector OTLP/HTTP
  #   9090  prometheus                      3001  grafana (NOT 3000 -- the dashboard owns that)
  #   3100  loki                            3200  tempo
  # ---------------------------------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: pepperx-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (also reachable in-network as otel-collector:4317)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - pepperx

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: pepperx-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - pepperx

  tempo:
    image: grafana/tempo:2.7.0
    container_name: pepperx-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API (Grafana reads this in-network as tempo:3200)
    networks:
      - pepperx

  loki:
    image: grafana/loki:3.3.2
    container_name: pepperx-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - pepperx

  grafana:
    image: grafana/grafana:11.4.0
    container_name: pepperx-grafana
    restart: unless-stopped
    environment:
      # Default credentials shown on the dashboard's Observability page. Change them for anything but a
      # local stack.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      # The datasources and the PepperX dashboard folder are provisioned from files below; no manual
      # setup is needed on first boot.
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3001 on the host: the PepperX dashboard already owns 3000.
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - pepperx

volumes:
  postgres-data:
  extent-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:

networks:
  pepperx:
    driver: bridge
